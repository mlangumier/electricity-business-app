<section class="title">
  <h1>Inscription</h1>
</section>

<section id="test-requests" class="flex flex-row justify-center gap-4">
  <button class="btn btn-primary" (click)="submitForm()">Email</button>
  <button class="btn btn-primary" (click)="testRegister()">Register</button>
  <button class="btn btn-primary" (click)="testLogin()">Login</button>
  <button class="btn btn-primary" (click)="testLogout()">Logout</button>
</section>

<section>
  <form class="fieldset bg-base-200 border-base-300 rounded-box w-full max-w-lg mx-auto border p-4">
    <fieldset class="fieldset">
      <!--TODO: ajouter check "isEmailAvailable"-->
      <label for="email" class="label">Adresse e-mail</label>
      <input id="email" type="email" class="input validator" required />
      <p class="validator-hint hidden">Valid email required</p>
    </fieldset>

    <div class="grid grid-cols-2 gap-4">
      <label class="fieldset">
        <label for="password" class="label">Mot de passe</label>
        <input id="password" type="password" class="input validator" required />
        <span class="validator-hint hidden">Required</span>
      </label>

      <label class="fieldset">
        <!--TODO: ajouter check w/directive-->
        <label for="passwordConfirm" class="label">Confirmez le mot de passe</label>
        <input id="passwordConfirm" type="password" class="input validator" required />
        <span class="validator-hint hidden">Required</span>
      </label>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <label class="fieldset">
        <label for="firstName" class="label">Prénom</label>
        <input id="firstName" type="text" class="input validator" required />
        <span class="validator-hint hidden">Required</span>
      </label>

      <label class="fieldset">
        <label for="lastName" class="label">Nom</label>
        <input id="lastName" type="text" class="input validator" required />
        <span class="validator-hint hidden">Required</span>
      </label>

      <label class="fieldset">
        <!--TODO: add regex?-->
        <label for="phoneNumber" class="label">Numéro de téléphone</label>
        <input id="phoneNumber" type="tel" class="input validator" required />
      </label>

      <label class="fieldset">
        <!-- TODO: formatter date du calendrier selon locale -->
        <label for="dateOfBirth" class="label">Date de naissance</label>
        <input id="dateOfBirth" type="date" class="input validator" required />
        <span class="validator-hint hidden">Required</span>
      </label>
    </div>

    <div class="form-actions">
      <button class="btn btn-primary" type="submit" (click)="submitForm()">Register</button>
    </div>
  </form>
</section>
